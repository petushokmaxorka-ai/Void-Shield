name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: System deps for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm fakeroot dpkg
      - run: npm ci
      - name: Fetch proxy cores
        run: |
          npm run fetch-xray
          bash scripts/fetch-singbox.sh --all
      - run: npm test
      - name: Verify packaging assets
        run: |
          test -f resources/icon.png
          test -x resources/bin/linux-x64/xray || test -f resources/bin/linux-x64/xray
          ls -lh resources/bin/linux-x64/
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: void-shield-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch proxy cores
        shell: bash
        run: |
          npm run fetch-xray
          bash scripts/fetch-singbox.sh --all
      - run: npm test
        shell: bash
      - name: Verify packaging assets
        shell: bash
        run: |
          test -f resources/icon.png
          test -f resources/bin/windows-x64/xray.exe
          ls -lh resources/bin/windows-x64/
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: void-shield-windows
          path: |
            release/*.exe
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/void-shield-linux/*
            dist/void-shield-windows/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
