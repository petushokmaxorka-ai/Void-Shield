name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: System deps for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm fakeroot dpkg
      - run: npm ci
      - name: Fetch proxy cores (linux only)
        run: |
          bash scripts/fetch-xray.sh
          bash scripts/fetch-singbox.sh
          ls -lh resources/bin/linux-x64/
          ls -lh resources/bin/*.dat || true
      - run: npm test
      - name: Compile
        run: npm run build
      - name: Package AppImage + tar.gz
        env:
          DEBUG: electron-builder
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: void-shield-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Fetch proxy cores (windows only)
        shell: bash
        run: |
          bash scripts/fetch-xray.sh
          bash scripts/fetch-singbox.sh
          ls -lh resources/bin/windows-x64/
          ls -lh resources/bin/*.dat || true
      - run: npm test
        shell: bash
      - name: Compile
        shell: bash
        run: npm run build
      - name: Package NSIS installer
        shell: bash
        env:
          DEBUG: electron-builder
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: void-shield-windows
          path: |
            release/*.exe
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/void-shield-linux/*
            dist/void-shield-windows/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
